<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0xArchive · Complete observability</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#050604; --ink:#e6e4d4; --dim:#7a7c6c; --line:#1a1c14; --panel:#0b0d08;
    --plant:#7dffc3; --oracle:#ffb347; --market:#e8ff4a; --acct:#c4b5fd; --tear:#ff5a3c; --late:#ffc857;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--ink); }
  body { font-family:var(--sans); display:grid; grid-template-rows:auto 1fr auto; overflow:hidden; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding:14px 22px 8px; }
  .brand { font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; }
  .brand b { color:var(--market); font-weight:600; }
  .lede { font-size:13px; color:var(--dim); max-width:44rem; line-height:1.4; }
  .ctl { margin-left:auto; display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; color:var(--dim); }
  .ctl button { font:inherit; color:var(--dim); background:transparent; border:1px solid var(--line); border-radius:4px; padding:4px 9px; cursor:pointer; }
  .ctl button.on { color:var(--ink); border-color:var(--dim); }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--dim); margin-right:6px; }
  .dot.on { background:var(--plant); }
  main { position:relative; min-height:0; }
  canvas { display:block; width:100%; height:100%; }
  #detail { position:absolute; right:22px; top:14px; width:min(380px, 42vw); max-height:calc(100% - 28px); overflow:auto; background:rgba(11,13,8,.94); border:1px solid var(--line); border-radius:6px; padding:10px 12px; font-family:var(--mono); font-size:11px; line-height:1.45; white-space:pre-wrap; display:none; }
  #detail .close { float:right; color:var(--dim); cursor:pointer; padding:0 4px; }
  footer { display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 24px; padding:8px 22px 16px; font-family:var(--mono); font-size:11px; color:var(--dim); }
  .now { color:var(--ink); font-family:var(--sans); font-size:13px; line-height:1.45; max-width:40rem; min-height:2.9em; }
  .stats { display:flex; flex-wrap:wrap; gap:6px 18px; }
  .stats b { color:var(--ink); font-weight:500; }
  .key { display:flex; gap:14px; margin-left:auto; flex-wrap:wrap; }
  .key i { display:inline-block; width:8px; height:8px; margin-right:5px; vertical-align:middle; }
  @media (max-width:720px) { .lede { display:none; } #detail { width:calc(100vw - 44px); } }
</style>
</head>
<body>
<header>
  <div class="brand">0xArchive <b>observability</b></div>
  <div class="lede">Heatmaps show liquidations. This shows whether you can trust them. Three rails, one incident, straight from webhooks.</div>
  <div class="ctl">
    <span><span id="dot" class="dot"></span><span id="conn">connecting</span></span>
    <button id="b-live" class="on">live</button>
    <button id="b-demo">demo loop</button>
    <span id="wins"><button data-w="120000" class="on">2m</button><button data-w="600000">10m</button><button data-w="3600000">60m</button></span>
    <span id="clock"></span>
  </div>
</header>
<main>
  <canvas id="c"></canvas>
  <div id="detail"><span class="close" id="detail-close">×</span><span id="detail-body"></span></div>
</main>
<footer>
  <div class="now" id="now">Waiting for the tape.</div>
  <div class="stats" id="stats"></div>
  <div class="key">
    <span><i style="background:var(--plant)"></i>plant</span>
    <span><i style="background:var(--oracle)"></i>oracle / chain</span>
    <span><i style="background:var(--market)"></i>market</span>
    <span><i style="background:var(--acct)"></i>watched account</span>
    <span><i style="background:var(--tear)"></i>open incident</span>
  </div>
</footer>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ── Rails: every 0xArchive event type lands on one of four rails ───────────
const RAILS = [
  { id:"plant",  label:"PLANT  archive · ingest",             y:0.22, color:"#7dffc3" },
  { id:"oracle", label:"ORACLE / CHAIN",                       y:0.44, color:"#ffb347" },
  { id:"market", label:"MARKET  liq · oi · funding · breadth", y:0.66, color:"#e8ff4a" },
  { id:"acct",   label:"WATCHED ACCOUNTS",                     y:0.86, color:"#c4b5fd" },
];
const RAIL = {};
for (const r of RAILS) RAIL[r.id] = r;
function railOf(type) {
  if (/^(archive\.|ingest\.|export\.|billing\.|webhook\.)/.test(type)) return "plant";
  if (/^(oracle\.|chain\.|hip4\.|market\.(listed|delisted))/.test(type)) return "oracle";
  if (/^account\./.test(type)) return "acct";
  return "market";
}
const OPENS  = { "archive.gap_detected":1, "ingest.stall":1, "oracle.stall":1, "chain.block_stall":1, "chain.block_time_degraded":1 };
const CLOSES = { "archive.gap_resolved":1, "ingest.recovered":1 };
function edgeOf(ev) {
  const st = ev.data && ev.data.state;
  if (CLOSES[ev.type] || st === "recovered" || st === "resolved" || st === "expired") return "close";
  if (OPENS[ev.type] && (st == null || st === "stalled" || st === "open" || st === "detected")) return "open";
  return null;
}
function incidentKey(ev) {
  const d = ev.data || {};
  return d.incident_id || d.gap_id || [ev.type.replace(/_(detected|resolved)$|\.(stall|recovered)$/, ""), d.stream || d.dex || d.symbol || d.venue || ""].join("|");
}

// ── Presentation per event type ────────────────────────────────────────────
const num = (v, d = 0) => (v == null || v === "" || isNaN(Number(v))) ? "" : Number(v).toLocaleString(undefined, { maximumFractionDigits:d });
const usd = (v) => v == null ? "" : "$" + (Math.abs(v) >= 1e6 ? (v/1e6).toFixed(2) + "M" : Math.abs(v) >= 1e3 ? (v/1e3).toFixed(1) + "k" : num(v, 0));
const short = (a) => typeof a === "string" && a.length > 12 ? a.slice(0, 6) + "…" + a.slice(-4) : (a || "");
function describe(ev) {
  const d = ev.data || {}, sym = d.symbol || d.coin || d.token || d.dex || d.stream || "";
  switch (ev.type) {
    case "market.liquidation":       return { title:`${sym} liq ${usd(d.notional_usd)}`, sub:`${d.side || ""} · ${short(d.liquidated_user)}`, tone:"mkt", weight:d.notional_usd };
    case "market.liquidation_burst": return { title:`BURST ${usd(d.total_usd ?? d.notional_usd ?? d.sum_usd)} / ${d.window_s || "?"}s`, sub:`${d.count ?? d.liquidations ?? ""} liquidations · your threshold`, tone:"burst" };
    case "market.oi_delta":          return { title:`${sym} OI ${d.direction === "down" || (d.change_pct ?? d.delta_pct) < 0 ? "−" : "+"}${num(Math.abs(d.change_pct ?? d.delta_pct ?? 0), 1)}%`, sub:`window ${d.window_s || ""}s`, tone:"mkt" };
    case "market.funding_flip":      return { title:`${sym} funding ${d.flipped_to === "negative" || (d.funding_rate ?? 0) < 0 ? "−" : "+"}`, sub:"sign change", tone:"mkt" };
    case "market.breadth_cross":     return { title:`breadth ${num(d.value ?? d.breadth_pct ?? d.pct, 0)}% ${d.direction || ""}`, sub:`threshold ${d.threshold ?? ""}`, tone:"mkt" };
    case "market.pga_payment":       return { title:`PGA ${num(d.amount, 2)} ${d.token || "HYPE"}`, sub:usd(d.notional_usd), tone:"mkt" };
    case "oracle.jump":              return { title:`${sym} ${d.direction === "down" ? "−" : "+"}${num(Math.abs(d.change_pct ?? 0), 2)}%`, sub:`HIP-3 oracle · ${num(d.interval_s, 1)}s`, tone:"warn" };
    case "oracle.stall":             return { title:`${sym} oracle ${d.state || ""}`, sub:`${num(d.age_s ?? d.silence_s, 0)}s silent`, tone:d.state === "recovered" ? "ok" : "tear" };
    case "chain.block_stall":        return { title:`chain ${d.state || ""}`, sub:`${num(d.gap_s ?? d.threshold_s, 0)}s`, tone:d.state === "recovered" ? "ok" : "tear" };
    case "chain.block_time_degraded":return { title:`block time ${d.state || ""}`, sub:`${num(d.deviation_pct, 0)}% vs baseline`, tone:d.state === "recovered" ? "ok" : "tear" };
    case "archive.gap_detected":     return { title:`${sym} gap`, sub:`silent ${num(d.gap_s ?? d.age_s, 0)}s`, tone:"tear" };
    case "archive.gap_resolved":     return { title:`${sym} gap closed`, sub:`${num(d.gap_s ?? d.duration_s, 0)}s · same incident`, tone:"ok" };
    case "ingest.stall":             return { title:`${d.stream || sym} stall`, sub:`${(d.coins || []).length || 1} market(s) · ${d.threshold_s || ""}s`, tone:"tear" };
    case "ingest.recovered":         return { title:`${d.stream || sym} recovered`, sub:"same incident_id", tone:"ok" };
    case "account.fill":             return { title:`${sym} ${d.side || ""} ${usd(d.notional_usd)}`, sub:short(d.account), tone:"acct", weight:d.notional_usd, side:d.side };
    case "account.transfer":         return { title:`${d.token || ""} ${num(d.amount, 2)} ${d.kind || ""}`, sub:`${short(d.address)} as ${d.role || ""}`, tone:"acct" };
    case "account.liquidated":       return { title:`${short(d.account)} liquidated`, sub:`${sym} ${usd(d.notional_usd)}`, tone:"acct-liq" };
    case "account.order_rejected":   return { title:`${short(d.account)} rejected`, sub:`${sym} · ${d.kind || ""}`, tone:"acct" };
    case "account.twap_lifecycle":   return { title:`${sym} TWAP ${d.status || ""}`, sub:short(d.account), tone:"acct" };
    default:                         return { title:ev.type, sub:sym, tone:railOf(ev.type) === "market" ? "mkt" : railOf(ev.type) === "oracle" ? "warn" : railOf(ev.type) === "acct" ? "acct" : "ok" };
  }
}

// ── Store ─────────────────────────────────────────────────────────────────
const events = new Map();            // id -> ev (arrival order)
const incidents = new Map();         // key -> { openAt, closeAt, rail }
let mode = "live", win = 120000, selected = null, latest = null;
const MAX = 3000;

function evTime(ev) { return Date.parse(ev.chain_ts || ev.observed_at || ev.received_at); }

function add(ev) {
  if (events.has(ev.id)) return;
  ev.rail = railOf(ev.type);
  ev.view = describe(ev);
  ev.t = evTime(ev);
  events.set(ev.id, ev);
  if (events.size > MAX) events.delete(events.keys().next().value);
  const edge = edgeOf(ev);
  if (edge) {
    const k = incidentKey(ev), inc = incidents.get(k) || { rail: ev.rail, openAt: null, closeAt: null };
    if (edge === "open") { inc.openAt = ev.t; inc.closeAt = null; } else { if (inc.openAt == null) inc.openAt = ev.t - 1; inc.closeAt = ev.t; }
    incidents.set(k, inc);
  }
  latest = ev;
}
function reset() { events.clear(); incidents.clear(); selected = null; latest = null; }

// ── Live feed ─────────────────────────────────────────────────────────────
let es = null;
function connect() {
  if (es) es.close();
  es = new EventSource("stream");
  es.addEventListener("hello", (m) => { const { recent } = JSON.parse(m.data); if (mode === "live") recent.forEach(add); $("dot").className = "dot on"; $("conn").textContent = "live"; });
  es.onmessage = (m) => { if (mode === "live") add(JSON.parse(m.data)); };
  es.onerror = () => { $("dot").className = "dot"; $("conn").textContent = "reconnecting"; };
}
let stats = null;
async function refreshStats() {
  try { stats = await (await fetch("stats", { cache:"no-store" })).json(); } catch {}
}

// ── Demo loop: the scripted incident, replayed through the same renderer ──
const LOOP = 28000;
const SCRIPT = [
  { t:1.2,  type:"archive.gap_detected",     data:{ symbol:"lighter_fills", gap_s:47, incident_id:"g-1842" } },
  { t:4.0,  type:"oracle.jump",              data:{ symbol:"xyz:NVDA", dex:"xyz", direction:"up", change_pct:2.1, interval_s:3.0 } },
  { t:6.4,  type:"market.oi_delta",          data:{ symbol:"BTC", direction:"down", change_pct:-3.4, window_s:300 } },
  { t:8.1,  type:"market.liquidation",       data:{ symbol:"BTC", side:"long", notional_usd:1200000, liquidated_user:"0x7a1c000000000000000000000000000000000b90e" } },
  { t:8.7,  type:"market.liquidation",       data:{ symbol:"ETH", side:"long", notional_usd:410000, liquidated_user:"0x3f9000000000000000000000000000000000021aa" } },
  { t:9.3,  type:"market.liquidation",       data:{ symbol:"SOL", side:"long", notional_usd:95000, liquidated_user:"0x11d0000000000000000000000000000000000c7f" } },
  { t:10.2, type:"market.liquidation_burst", data:{ symbol:"BTC", total_usd:8400000, window_s:60, count:41 } },
  { t:11.4, type:"market.funding_flip",      data:{ symbol:"BTC", flipped_to:"negative", funding_rate:-0.00012 } },
  { t:13.0, type:"account.liquidated",       data:{ symbol:"BTC", account:"0x7a1c000000000000000000000000000000000b90e", notional_usd:1200000 } },
  { t:16.5, type:"oracle.jump",              data:{ symbol:"xyz:NVDA", dex:"xyz", direction:"down", change_pct:-1.9, interval_s:3.1 } },
  { t:19.8, type:"archive.gap_resolved",     data:{ symbol:"lighter_fills", gap_s:91, incident_id:"g-1842" } },
  { t:22.4, type:"market.breadth_cross",     data:{ value:61, direction:"above", threshold:60 } },
];
const COPY = [
  [0,    "A heatmap would already be drawing liquidations. We have not earned them yet."],
  [1.2,  "Plant rail tears: archive.gap_detected. Every market print below this is untrusted until it heals."],
  [4.0,  "Oracle rail spikes on xyz:NVDA. A HIP-3 oracle jump, not a candle."],
  [8.1,  "Market rain: liquidations, still on a torn plant."],
  [10.2, "liquidation_burst is the cell, not another drop. The gradient is yours to set."],
  [13.0, "Watched account caught. Completeness includes who, not only the book."],
  [19.8, "Gap resolved on the same incident_id. Now the cascade is a fact, not a rumor."],
  [22.4, "Breadth crosses. A session field, not a ticker."],
];
let demoStart = 0, demoCursor = 0;
function demoTick(now) {
  const t = ((now - demoStart) % LOOP) / 1000;
  if (t < demoCursor) { reset(); demoCursor = 0; }
  for (const s of SCRIPT) {
    if (s.t <= t && s.t >= demoCursor) {
      const at = new Date(Date.now() - (t - s.t) * 1000).toISOString();
      add({ id:`demo-${s.t}-${Math.floor((now - demoStart) / LOOP)}`, type:s.type, received_at:at, observed_at:at, chain_ts:at, late:false, late_ms:0, data:s.data });
    }
  }
  demoCursor = t;
  return t;
}

// ── Drawing ───────────────────────────────────────────────────────────────
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2), r = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, r.width * dpr); canvas.height = Math.max(1, r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const glyphs = [];  // hit targets for click

function draw(now) {
  const rect = canvas.getBoundingClientRect(), w = rect.width, h = rect.height;
  const left = 150, right = w - 40, span = right - left;
  let t0, t1, playhead = null, demoT = null;
  if (mode === "demo") {
    demoT = demoTick(now);
    t1 = Date.now(); t0 = t1 - demoT * 1000;               // demo window grows with the loop: 0 .. 28 s
    const total = LOOP; t0 = t1 - demoT * 1000; t1 = t0 + total;
    playhead = left + (demoT * 1000 / total) * span;
    $("clock").textContent = "t+" + demoT.toFixed(1) + "s · loop 28s";
  } else {
    t1 = Date.now(); t0 = t1 - win;
    $("clock").textContent = new Date().toLocaleTimeString() + " · last " + (win / 60000) + " min";
  }
  const X = (ms) => left + ((ms - t0) / (t1 - t0)) * span;

  ctx.fillStyle = "#050604"; ctx.fillRect(0, 0, w, h);
  // time ticks
  ctx.strokeStyle = "#14160e"; ctx.lineWidth = 1;
  const ticks = mode === "demo" ? 28 : (win / 60000 <= 2 ? 24 : 20);
  for (let i = 0; i <= ticks; i++) { const x = left + (i / ticks) * span; ctx.beginPath(); ctx.moveTo(x, h * 0.10); ctx.lineTo(x, h * 0.94); ctx.stroke(); }
  if (playhead != null) {
    ctx.fillStyle = "rgba(232,255,74,0.07)"; ctx.fillRect(left, h * 0.10, playhead - left, h * 0.84);
    ctx.strokeStyle = "#e8ff4a"; ctx.beginPath(); ctx.moveTo(playhead, h * 0.08); ctx.lineTo(playhead, h * 0.96); ctx.stroke();
  } else {
    ctx.strokeStyle = "#e8ff4a55"; ctx.beginPath(); ctx.moveTo(right, h * 0.08); ctx.lineTo(right, h * 0.96); ctx.stroke();
    ctx.fillStyle = "#7a7c6c"; ctx.font = "500 10px " + getComputedStyle(document.body).getPropertyValue("--mono"); ctx.fillText("now", right - 24, h * 0.07);
  }
  // rails
  for (const r of RAILS) {
    const y = h * r.y;
    ctx.strokeStyle = r.color + "55"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
    ctx.fillStyle = r.color; ctx.font = "500 10px " + getComputedStyle(document.body).getPropertyValue("--mono"); ctx.fillText(r.label, 22, y + 3);
  }
  // open incidents: torn segments
  for (const inc of incidents.values()) {
    const y = h * RAIL[inc.rail].y, x0 = clamp(X(inc.openAt), left, right), x1 = clamp(X(inc.closeAt ?? t1), left, right);
    if (x1 <= x0) continue;
    ctx.strokeStyle = inc.closeAt ? "#ff5a3c88" : "#ff5a3c"; ctx.lineWidth = 3; ctx.setLineDash([5, 6]);
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.setLineDash([]);
  }
  // events
  glyphs.length = 0;
  const perRailLabels = { plant:0, oracle:0, market:0, acct:0 };
  const list = [...events.values()].filter((e) => e.t >= t0 - 5000 && e.t <= t1).sort((a, b) => b.t - a.t);
  const mono = getComputedStyle(document.body).getPropertyValue("--mono"), sans = getComputedStyle(document.body).getPropertyValue("--sans");
  for (const ev of list) {
    const x = X(ev.t); if (x < left - 10) continue;
    const r = RAIL[ev.rail]; let y = h * r.y;
    const v = ev.view, age = ((mode === "demo" ? t0 + demoT * 1000 : t1) - ev.t) / 1000;
    const alpha = mode === "demo" ? clamp(1 - age / 18, 0.25, 1) : clamp(1 - age / ((t1 - t0) / 1000), 0.3, 1);
    ctx.globalAlpha = reduced ? 1 : alpha;
    const weight = v.weight ? clamp(Math.log10(Math.max(1, v.weight)) - 2, 0.5, 5) : 1;
    let hit = 8;
    if (v.tone === "burst") {
      const rr = 16 + Math.min(age * 8, 28);
      ctx.strokeStyle = "#e8ff4a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#e8ff4a"; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill(); hit = 18;
    } else if (v.tone === "tear") {
      ctx.fillStyle = "#ff5a3c"; ctx.fillRect(x - 2, y - 14, 4, 28); hit = 14;
    } else if (v.tone === "ok") {
      ctx.fillStyle = r.color; ctx.fillRect(x - 6, y - 6, 12, 12);
    } else if (v.tone === "warn") {
      ctx.fillStyle = "#ffb347"; ctx.beginPath(); ctx.moveTo(x, y - 9); ctx.lineTo(x + 8, y + 7); ctx.lineTo(x - 8, y + 7); ctx.closePath(); ctx.fill();
    } else if (v.tone === "acct-liq") {
      ctx.fillStyle = "#ff5a3c"; ctx.beginPath(); ctx.moveTo(x, y - 9); ctx.lineTo(x + 8, y + 7); ctx.lineTo(x - 8, y + 7); ctx.closePath(); ctx.fill();
    } else if (v.tone === "acct") {
      ctx.fillStyle = v.side === "sell" ? "#ff8c7a" : "#c4b5fd"; ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + 6, y); ctx.lineTo(x, y + 6); ctx.lineTo(x - 6, y); ctx.closePath(); ctx.fill();
    } else {
      const rad = 4 + weight * 2.4;
      ctx.fillStyle = "#e8ff4a"; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill(); hit = rad + 4;
    }
    if (ev.late) { ctx.strokeStyle = "#ffc857"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, hit + 3, 0, Math.PI * 2); ctx.stroke(); }
    glyphs.push({ x, y, r: hit, ev });
    const wantLabel = ev === selected || v.tone === "burst" || v.tone === "tear" || v.tone === "ok" || (perRailLabels[ev.rail] < 3 && age < (t1 - t0) / 1000 * 0.35);
    if (wantLabel) {
      perRailLabels[ev.rail] += 1;
      const lift = (perRailLabels[ev.rail] % 2) ? -22 : 14;
      ctx.fillStyle = "#e6e4d4"; ctx.font = "500 11px " + mono; ctx.fillText(ev.type, x + 12, y + lift - 6);
      ctx.fillStyle = "#7a7c6c"; ctx.font = "400 10px " + sans; ctx.fillText(v.title + (v.sub ? "  " + v.sub : ""), x + 12, y + lift + 8);
    }
    ctx.globalAlpha = 1;
  }
  if (selected && events.has(selected.id)) { const x = X(selected.t), y = h * RAIL[selected.rail].y; ctx.strokeStyle = "#e6e4d4"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI * 2); ctx.stroke(); }

  // captions
  if (mode === "demo") {
    let line = COPY[0][1]; for (const [ts, s] of COPY) if (demoT >= ts) line = s;
    $("now").textContent = line;
  } else if (latest) {
    const v = latest.view, ago = Math.max(0, (Date.now() - latest.t) / 1000);
    $("now").textContent = `${latest.type}: ${v.title}${v.sub ? ", " + v.sub : ""}. ${ago < 90 ? ago.toFixed(0) + " s ago" : new Date(latest.t).toLocaleTimeString()}${latest.late ? ", delivered late" : ""}.`;
  }
  const open = [...incidents.values()].filter((i) => !i.closeAt).length;
  const counts = { plant:0, oracle:0, market:0, acct:0 }; for (const e of list) counts[e.rail] += 1;
  const lat = stats && stats.latencyMs ? stats.latencyMs.chainToReceived : null;
  const fmt = (ms) => ms == null ? "–" : ms < 1000 ? Math.round(ms) + " ms" : (ms / 1000).toFixed(1) + " s";
  $("stats").innerHTML = `<span>open incidents <b>${open}</b></span><span>plant <b>${counts.plant}</b></span><span>oracle <b>${counts.oracle}</b></span><span>market <b>${counts.market}</b></span><span>accounts <b>${counts.acct}</b></span>` +
    (mode === "live" && stats ? `<span>block to here p50 <b>${fmt(lat && lat.p50)}</b> p95 <b>${fmt(lat && lat.p95)}</b></span><span>late <b>${stats.late}</b></span><span>rejected <b>${stats.rejected}</b></span>` : "");
  requestAnimationFrame(draw);
}

// ── Interaction ───────────────────────────────────────────────────────────
canvas.addEventListener("click", (e) => {
  const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bd = 1e9;
  for (const g of glyphs) { const d = Math.hypot(g.x - mx, g.y - my); if (d < g.r + 6 && d < bd) { bd = d; best = g; } }
  selected = best ? best.ev : null;
  if (selected) { $("detail-body").textContent = JSON.stringify(selected, (k, v) => (k === "view" || k === "rail" || k === "t") ? undefined : v, 2); $("detail").style.display = "block"; }
  else $("detail").style.display = "none";
});
$("detail-close").onclick = () => { selected = null; $("detail").style.display = "none"; };
function setMode(m) {
  mode = m; reset();
  $("b-live").className = m === "live" ? "on" : ""; $("b-demo").className = m === "demo" ? "on" : "";
  $("wins").style.visibility = m === "live" ? "visible" : "hidden";
  if (m === "demo") { demoStart = performance.now(); demoCursor = 0; $("conn").textContent = "scripted incident"; $("dot").className = "dot"; }
  else connect();
  history.replaceState(null, "", m === "demo" ? "?demo=1" : location.pathname);
}
$("b-live").onclick = () => setMode("live");
$("b-demo").onclick = () => setMode("demo");
for (const b of $("wins").querySelectorAll("button")) b.onclick = () => { win = Number(b.dataset.w); for (const o of $("wins").querySelectorAll("button")) o.className = o === b ? "on" : ""; };

resize();
setMode(new URLSearchParams(location.search).get("demo") ? "demo" : "live");
refreshStats(); setInterval(refreshStats, 5000);
requestAnimationFrame(draw);
})();
</script>
</body>
